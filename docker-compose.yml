# DataPilot: PostgreSQL + FastAPI backend + React frontend (nginx).
#   cp .env.example .env    # choose an AI provider (free: ollama or gemini)
#   docker compose up --build
#   open http://localhost:8080

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datapilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datapilot}
      POSTGRES_DB: datapilot
      READER_PASSWORD: ${READER_PASSWORD:-reader}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapilot -d datapilot"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Metadata store (conversations, query history, registered sources).
      DATABASE_URL: postgresql://datapilot:${POSTGRES_PASSWORD:-datapilot}@postgres:5432/datapilot
      # The demo is seeded by its owner but queried through a read-only role.
      DEMO_SEED_DATABASE_URL: postgresql://datapilot:${POSTGRES_PASSWORD:-datapilot}@postgres:5432/sales_demo
      DEMO_DATABASE_URL: postgresql://datapilot_reader:${READER_PASSWORD:-reader}@postgres:5432/sales_demo
      CORS_ORIGINS: '["http://localhost:8080"]'
    # Lets the container reach Ollama running on the host (LLM_BASE_URL=http://host.docker.internal:11434/v1).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
